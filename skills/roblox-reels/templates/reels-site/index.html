<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hat Town Reels</title>
<style>
  :root { --ink:#0b0a0c; --paper:#f6ead0; --yellow:#ffd21f; --sky:#3e7fd2; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--ink); color:#fff; font-family: "DejaVu Sans", "Segoe UI", system-ui, sans-serif; }
  #feed { height:100dvh; overflow-y:scroll; scroll-snap-type:y mandatory; scrollbar-width:none; }
  #feed::-webkit-scrollbar { display:none; }
  .reel { height:100dvh; scroll-snap-align:start; scroll-snap-stop:always; position:relative; display:flex; justify-content:center; align-items:center; background:radial-gradient(ellipse at 50% 20%, #1b2a47, var(--ink) 70%); }
  .stage { position:relative; height:100%; aspect-ratio:9/16; max-width:100vw; background:#000; overflow:hidden; }
  video { width:100%; height:100%; object-fit:cover; display:block; }
  .shade { position:absolute; inset:auto 0 0 0; height:42%; background:linear-gradient(transparent, rgba(0,0,0,.82)); pointer-events:none; }
  .info { position:absolute; left:14px; right:76px; bottom:18px; }
  .kind { display:inline-block; background:var(--yellow); color:var(--ink); font-weight:900; font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding:4px 8px; border:2px solid var(--ink); box-shadow:3px 3px 0 var(--ink); }
  h2 { margin:10px 0 6px; font-size:19px; line-height:1.2; font-weight:900; text-wrap:balance; text-shadow:2px 2px 0 var(--ink); }
  .cap { font-size:13.5px; line-height:1.4; white-space:pre-line; max-height:4.2em; overflow:hidden; opacity:.95; }
  .cap.open { max-height:40dvh; overflow:auto; }
  .more { background:none; border:0; color:var(--yellow); font-weight:800; font-size:13px; padding:4px 0; cursor:pointer; }
  .rail { position:absolute; right:10px; bottom:22px; display:flex; flex-direction:column; gap:12px; }
  .rail a, .rail button { width:52px; height:52px; border-radius:50%; border:3px solid var(--ink); background:var(--paper); color:var(--ink); font-weight:900; font-size:11px; display:grid; place-items:center; text-decoration:none; cursor:pointer; box-shadow:3px 3px 0 var(--ink); }
  .rail button:active, .rail a:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  .rail :focus-visible, .more:focus-visible { outline:3px solid var(--yellow); outline-offset:2px; }
  .count { position:absolute; top:14px; left:14px; font-weight:900; font-size:12px; background:rgba(11,10,12,.65); padding:5px 9px; border-radius:99px; }
  .bar { position:absolute; left:0; bottom:0; height:4px; background:var(--yellow); width:0; }
  dialog { border:3px solid var(--ink); background:var(--paper); color:var(--ink); max-width:min(92vw,460px); width:100%; padding:18px; box-shadow:6px 6px 0 var(--yellow); }
  dialog::backdrop { background:rgba(0,0,0,.7); }
  dialog h3 { margin:0 0 10px; font-size:17px; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:6px 12px; margin:0; font-size:13px; }
  dt { font-weight:900; } dd { margin:0; overflow-wrap:anywhere; }
  pre { white-space:pre-wrap; font:12.5px/1.45 inherit; background:#fff; border:2px solid var(--ink); padding:10px; max-height:30dvh; overflow:auto; }
  dialog button { margin-top:12px; padding:8px 14px; font-weight:900; border:3px solid var(--ink); background:var(--yellow); cursor:pointer; }
  @media (prefers-reduced-motion: reduce) { #feed { scroll-behavior:auto; } }
</style>
</head>
<body>
<main id="feed" aria-label="Reels feed"></main>
<dialog id="meta"><h3 id="mt"></h3><dl id="md"></dl><pre id="ms"></pre><button id="mc">Close</button></dialog>
<script>
const feed = document.getElementById('feed'), dlg = document.getElementById('meta');
let muted = true;
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.textContent = h; return e; };
fetch('/meta.json').then(r => r.json()).then(items => {
  items.forEach((it, i) => {
    const s = el('section', 'reel'), st = el('div', 'stage');
    const v = el('video'); v.src = '/' + it.file; v.poster = '/' + it.poster; v.loop = true; v.muted = true; v.playsInline = true; v.preload = i ? 'metadata' : 'auto';
    v.setAttribute('aria-label', it.title);
    const info = el('div', 'info'); info.append(el('span', 'kind', it.kind), el('h2', '', it.title));
    const cap = el('div', 'cap', it.caption), more = el('button', 'more', 'more');
    more.onclick = () => { more.textContent = cap.classList.toggle('open') ? 'less' : 'more'; };
    info.append(cap, more);
    const rail = el('div', 'rail');
    const snd = el('button', '', 'SOUND'); snd.setAttribute('aria-label', 'Toggle sound');
    snd.onclick = () => { muted = !muted; document.querySelectorAll('video').forEach(x => x.muted = muted); document.querySelectorAll('.snd').forEach(b => b.textContent = muted ? 'SOUND' : 'MUTE'); };
    snd.classList.add('snd');
    const inf = el('button', '', 'INFO'); inf.onclick = () => showMeta(it);
    const dl = el('a', '', 'SAVE'); dl.href = '/' + it.file; dl.download = it.id + '.mp4'; dl.setAttribute('aria-label', 'Download ' + it.title);
    rail.append(snd, inf, dl);
    const bar = el('div', 'bar');
    v.ontimeupdate = () => { bar.style.width = (v.currentTime / (v.duration || 1) * 100) + '%'; };
    v.onclick = () => v.paused ? v.play() : v.pause();
    st.append(v, el('div', 'shade'), el('div', 'count', (i + 1) + ' / ' + items.length), info, rail, bar);
    s.append(st); feed.append(s);
  });
  const io = new IntersectionObserver(es => es.forEach(e => { const v = e.target.querySelector('video'); if (e.isIntersecting) { v.muted = muted; v.play().catch(() => {}); } else { v.pause(); } }), { threshold: 0.6 });
  document.querySelectorAll('.reel').forEach(r => io.observe(r));
});
function showMeta(it) {
  document.getElementById('mt').textContent = it.title;
  const d = document.getElementById('md'); d.replaceChildren();
  [['File', it.id + '.mp4'], ['Size', it.size_mb + ' MB'], ['Resolution', it.width + ' x ' + it.height], ['Length', it.duration + ' s @ ' + it.fps + ' fps'], ['Skills', it.skills], ['Voice', it.voice], ['Music', it.music], ['Created', it.created]]
    .forEach(([k, val]) => d.append(el('dt', '', k), el('dd', '', val)));
  document.getElementById('ms').textContent = it.script;
  dlg.showModal();
}
document.getElementById('mc').onclick = () => dlg.close();
</script>
</body>
</html>
